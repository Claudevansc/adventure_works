version: 2

models:
  # =========================================================================
  # Área Person
  # =========================================================================
  - name: stg_adventure_works__person_person
    description: "Modelo de staging com dados cadastrais de pessoas e contactos."
    columns:
      - name: person_id
        description: "ID único da pessoa (Chave Primária)."
        tests:          
          - unique
          - not_null

  - name: stg_adventure_works__person_address
    description: "Endereços cadastrados no sistema."
    columns:
      # Observação: Indicium
      # Teste genérico de relacionamento: Valida a consistência das chaves estrangeiras entre tabelas transacionais 
      # e de entidades, garantindo que a morada referenciada está registada na tabela de origem.
      - name: address_id
        description: "ID único do endereço."
        tests:
          - unique
          - not_null

  - name: stg_adventure_works__person_stateprovince
    description: "Estados e províncias."
    columns:
      # Observação: Indicium
      # Teste genérico de relacionamento: Garante a integridade referencial validando se todos os IDs de 
      # estado/província presentes nesta tabela existem efetivamente na tabela de dimensões correspondente.
      - name: state_province_id
        description: "ID único do estado/província."
        tests:
          - unique
          - not_null

  - name: stg_adventure_works__person_countryregion
    description: "Países e regiões."
    columns:
      - name: country_region_code
        description: "Código do país."
        tests:
          - unique
          - not_null

  # =========================================================================
  # Área Sales
  # =========================================================================
  - name: stg_sales_customer
    description: "Dados dos clientes das vendas."
    columns:
      - name: customer_id
        description: "ID único do cliente."
        tests:
          - unique
          - not_null

  - name: stg_sales_salesorderheader
    description: "Cabeçalho dos pedidos de vendas (resumo das ordens de venda)."
    columns:
      - name: sales_order_id
        description: "ID único do pedido de venda."
        tests:
          - unique
          - not_null

      # Observação: Indicium
      # Testes genéricos: Relacionamentos
      # Chave estrangeira: Valida a integridade referencial entre os pedidos e os clientes registados.
      - name: customer_id  
        description: "ID do cliente associado à venda."
        tests:
          - not_null
          - relationships:
              arguments:
                field: customer_id
                to: ref('stg_adventure_works__sales_customer')  


  - name: stg_sales_salesorderdetail
    description: "Itens detalhados de cada pedido de venda."
    columns:
      - name: sales_order_detail_id
        description: "ID único da linha do pedido."
        tests:
          - unique
          - not_null

  - name: stg_sales_salesterritory
    description: "Territórios e regiões de vendas."
    columns:
      # Observação: Indicium
      # Teste genérico de relacionamento: Assegura que não existem órfãos de territórios nas vendas/clientes, 
      # confirmando que cada ID mapeado possui correspondência na tabela de territórios de vendas.
      - name: territory_id
        description: "ID do território de vendas."
        tests:
          - unique
          - not_null

  - name: stg_adventure_works__sales_creditcard
    description: "Cartões de crédito cadastrados para pagamento."
    columns:
      - name: credit_card_id
        description: "ID único do cartão de crédito."
        tests:
          - unique
          - not_null

      # Observação: Indicium
      # Teste genérico Tipo de cartões: valida os tipos de cartões aceites mapeados na base de dados (Adventure Works)
      - name: card_type
        description: "Tipo de cartão."
        tests:
          - accepted_values:
              arguments:
                values: ['ColonialVoice', 'Vista', 'Distinguish', 'SuperiorCard']

  - name: stg_adventure_works__sales_salesorderheadersalesreason
    description: "Tabela de associação entre o pedido e o motivo da venda."
    columns:
      - name: sales_order_id
        description: "ID do pedido de venda."
        tests:
          - not_null
      - name: sales_reason_id
        description: "ID do motivo de venda."
        tests:
          - not_null

  - name: stg_adventure_works__sales_salesreason
    description: "Motivos das vendas (ex: Promotion, Price, etc.)."
    columns:
      - name: sales_reason_id
        description: "ID do motivo de venda."
        tests:
          - unique
          - not_null

  # =========================================================================
  # Área Production
  # =========================================================================
  - name: stg_product
    description: "Cadastro principal de produtos."
    columns:
      - name: product_id
        description: "ID único do produto."
        tests:
          - unique
          - not_null

  - name: stg_productsubcategory
    description: "Subcategorias de produtos."
    columns:
      - name: product_subcategory_id
        description: "ID da subcategoria."
        tests:
          - unique
          - not_null

  - name: stg_productcategory
    description: "Categorias de produtos."
    columns:
      - name: product_category_id
        description: "ID da categoria."
        tests:
          - unique
          - not_null

  - name: stg_productinventory
    description: "Controlo de stock e inventário dos produtos."

  # =========================================================================
  # Área Purchasing
  # =========================================================================
  - name: stg_purchasing_vendor
    description: "Cadastro de fornecedores."
    columns:
      - name: business_entity_id
        description: "ID do fornecedor."
        tests:
          - unique
          - not_null

  - name: stg_purchaseorderheader
    description: "Cabeçalho das ordens de compra aos fornecedores."
    columns:
      - name: purchase_order_id
        description: "ID único da ordem de compra."
        tests:
          - unique
          - not_null

  - name: stg_purchaseorderdetail
    description: "Detalhes dos itens das ordens de compra."

  # =========================================================================
  # Área Human Resources
  # =========================================================================
  - name: stg_employee
    description: "Cadastro de funcionários."
    columns:
      - name: business_entity_id
        description: "ID do funcionário."
        tests:
          - unique
          - not_null

  - name: stg_department
    description: "Departamentos da empresa."
    columns:
      - name: department_id
        description: "ID do departamento."
        tests:
          - unique
          - not_null